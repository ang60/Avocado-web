      operationId: advisory_services_advisories_list
      parameters:
      - in: query
        name: action_taken
        schema:
          type: string
      - in: query
        name: outcome
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Advisory Services
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdvisoryList'
          description: ''
    post:
      operationId: advisory_services_advisories_create
      tags:
      - Advisory Services
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Advisory'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Advisory'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Advisory'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Advisory'
          description: ''
