components:
  schemas:
    AIQueryError:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    AIQueryRequest:
      type: object
      properties:
        query:
          type: string
      required:
      - query
    AIQueryResponse:
      type: object
      properties:
        query:
          type: string
        response:
          type: string
      required:
      - query
      - response
    Advisory:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        weekly_record:
          type: string
          format: uuid
        farmer:
          type: string
          format: uuid
        advisory_message:
          type: string
        actions_taken:
          type: string
          nullable: true
          maxLength: 100
        outcome:
          type: string
          nullable: true
          maxLength: 100
        remarks:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
          maxLength: 100
        timestamp:
          type: string
          format: date-time
          readOnly: true
        action_taken_status:
          type: string
          readOnly: true
        time_ago:
          type: string
          readOnly: true
      required:
      - action_taken_status
      - advisory_message
      - farmer
      - id
      - time_ago
      - timestamp
      - weekly_record
    Alert:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        farmer:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 255
        message:
          type: string
        is_read:
          type: boolean
        category:
          type: string
          nullable: true
          maxLength: 100
        timestamp:
          type: string
          format: date-time
          readOnly: true
        time_ago:
          type: string
          readOnly: true
      required:
      - farmer
      - id
      - message
      - time_ago
      - timestamp
      - title
    AnyDiseasesObservedEnum:
      enum:
      - 'Yes'
      - 'No'
      type: string
      description: |-
        * `Yes` - Yes
        * `No` - No
    AppPermission:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
      required:
      - id
      - name
    BasicUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        phone_number:
          type: string
          maxLength: 15
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          nullable: true
          maxLength: 254
        identification_number:
          type: string
          nullable: true
          maxLength: 50
        profile_picture:
          type: string
          format: uri
          nullable: true
      required:
      - id
      - phone_number
    BlankEnum:
      enum:
      - ''
    Case:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        case_title:
          type: string
          maxLength: 255
        severity:
          $ref: '#/components/schemas/CaseSeverityEnum'
        status:
          $ref: '#/components/schemas/StatusEnum'
        pest_scouting_record:
          allOf:
          - $ref: '#/components/schemas/WeeklyRecord'
          readOnly: true
        scouting_record_id:
          type: string
          format: uuid
          writeOnly: true
        initial_notes:
          type: string
          nullable: true
        notes:
          type: string
        diagnosis:
          type: string
          nullable: true
        recommended_actions:
          type: string
          nullable: true
        recommended_chemical:
          type: string
          nullable: true
          maxLength: 255
        application_rate:
          type: string
          nullable: true
          maxLength: 255
        pre_harvest_interval:
          type: string
          nullable: true
          maxLength: 255
        assigned_agronomist:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        agronomist_id:
          type: string
          format: uuid
          writeOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - assigned_agronomist
      - case_title
      - created_at
      - id
      - notes
      - pest_scouting_record
      - updated_at
    CaseAssignment:
      type: object
      properties:
        assigned_agronomist:
          type: string
          format: uuid
        notes:
          type: string
      required:
      - assigned_agronomist
    CaseAssignmentError:
      type: object
      properties:
        error: {}
      required:
      - error
    CaseAssignmentResponse:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    CaseClose:
      type: object
      properties:
        diagnosis:
          type: string
        recommended_actions:
          type: array
          items:
            type: string
          minItems: 1
        recommended_chemical:
          type: string
        application_rate:
          type: string
        pre_harvest_interval:
          type: string
      required:
      - application_rate
      - diagnosis
      - pre_harvest_interval
      - recommended_actions
      - recommended_chemical
    CaseCloseError:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    CaseCloseResponse:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    CaseSeverityEnum:
      enum:
      - high
      - medium
      - low
      - unknown
      type: string
      description: |-
        * `high` - High
        * `medium` - Medium
        * `low` - Low
        * `unknown` - Unknown
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
          nullable: true
        material_count:
          type: integer
          readOnly: true
        active_use_cases_count:
          type: integer
          readOnly: true
          default: 0
      required:
      - active_use_cases_count
      - id
      - material_count
      - name
    ChemicalGateEnum:
      enum:
      - gated
      - open
      type: string
      description: |-
        * `gated` - Gated
        * `open` - Open
    DiseaseCropStageEnum:
      enum:
      - Flowering
      - Pin head
      - Golf size
      - Maturing
      - Mature
      type: string
      description: |-
        * `Flowering` - Flowering
        * `Pin head` - Pin head
        * `Golf size` - Golf size
        * `Maturing` - Maturing
        * `Mature` - Mature
    DiseaseDetectionMethodEnum:
      enum:
      - Self-observation
      - Extension officer
      - Agronomist
      - KEPHIS inspector
      type: string
      description: |-
        * `Self-observation` - Self-observation
        * `Extension officer` - Extension officer
        * `Agronomist` - Agronomist
        * `KEPHIS inspector` - KEPHIS inspector
    Entity:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        linked_farmers:
          type: integer
          readOnly: true
        entity_type:
          $ref: '#/components/schemas/EntityTypeEnum'
        company_name:
          type: string
          maxLength: 255
        HCDA_license:
          type: string
          maxLength: 100
        license_expiry_date:
          type: string
          format: date
        head_agronomist:
          type: string
          maxLength: 255
        primary_county:
          type: string
          maxLength: 100
        company_email:
          type: string
          format: email
          maxLength: 254
        phone_number:
          type: string
          maxLength: 15
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - HCDA_license
      - company_email
      - company_name
      - created_at
      - entity_type
      - head_agronomist
      - id
      - license_expiry_date
      - linked_farmers
      - phone_number
      - primary_county
      - updated_at
    EntityTypeEnum:
      enum:
      - Exporter
      - Government - KEPHIS
      - Government - HCDA
      - Partner Organization
      type: string
      description: |-
        * `Exporter` - Exporter
        * `Government - KEPHIS` - Government - KEPHIS
        * `Government - HCDA` - Government - HCDA
        * `Partner Organization` - Partner Organization
    ExportError:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    ExporterCompliance:
      type: object
      properties:
        id:
          type: string
          format: uuid
        exporterName:
          type: string
        farmerCount:
          type: integer
        restrictedBlocks:
          type: integer
        riskScore:
          type: integer
        county:
          type: string
      required:
      - county
      - exporterName
      - farmerCount
      - id
      - restrictedBlocks
      - riskScore
    Farm:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        farmer_name:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        farmer_name_id:
          type: string
          format: uuid
          writeOnly: true
        farm_name:
          type: string
          maxLength: 255
        location:
          type: string
          maxLength: 255
        number_of_blocks:
          type: integer
          maximum: 2147483647
          minimum: 0
        farm_size:
          type: number
          format: double
        timestamp:
          type: string
          format: date-time
          readOnly: true
      required:
      - farm_name
      - farmer_name
      - id
      - location
      - timestamp
    FarmBlock:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        farmer:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        farmer_id:
          type: string
          format: uuid
          writeOnly: true
        farm_name:
          allOf:
          - $ref: '#/components/schemas/Farm'
          readOnly: true
        farm_name_id:
          type: string
          format: uuid
          writeOnly: true
        block_name:
          type: string
          maxLength: 255
        number_of_trees:
          type: integer
          maximum: 2147483647
          minimum: 0
        timestamp:
          type: string
          format: date-time
          readOnly: true
      required:
      - block_name
      - farm_name
      - farmer
      - id
      - number_of_trees
      - timestamp
    FarmerLinkAgronomist:
      type: object
      properties:
        agronomist_id:
          type: string
          format: uuid
        farmer_id:
          type: string
          format: uuid
        otp_code:
          type: string
          maxLength: 6
      required:
      - otp_code
    FarmerLinkAgronomistError:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    FarmerLinkAgronomistForbiddenError:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    FarmerLinkAgronomistNotFoundError:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    FarmerLinkAgronomistResponse:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    FarmerRegistration:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        farmerName:
          type: string
          maxLength: 255
        hcdaRegNumber:
          type: string
          maxLength: 100
        ward:
          type: string
          maxLength: 100
        county:
          type: string
          maxLength: 100
        acreage:
          type: number
          format: double
        globalGAPStatus:
          type: string
          maxLength: 50
        globalGAPExpiry:
          type: string
          format: date
        primaryExporter:
          type: string
          maxLength: 255
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        created_at:
