<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Reset - AvoGuard</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.5; color: #374151;">
  <h2>Hello {{ user.first_name|default:"User" }},</h2>
  <p>You requested a password reset for your AvoGuard account.</p>
  <p>
    Your verification code is:
    <strong style="font-size: 20px; letter-spacing: 4px;">{{ reset_code }}</strong>
  </p>
  <p>This code expires in {{ expiry_minutes }} minutes.</p>
  <p>If you did not request this, ignore this email.</p>
</body>
</html>
