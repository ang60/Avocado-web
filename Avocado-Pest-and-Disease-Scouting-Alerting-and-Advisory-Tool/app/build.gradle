plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.avocado.android'
    compileSdk 36

    defaultConfig {
        applicationId "com.avocado.android"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.lifecycle.livedata.ktx
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    implementation libs.activity
    implementation libs.flexbox
    implementation libs.glide
    implementation(libs.android.networking) { // Prevent duplicate class found error caused by mixing old Android Support libraries (com.android.support:*) with AndroidX (androidx.*), which is not allowed
        exclude group: "com.android.support"
    }
    implementation libs.play.services.location
    implementation libs.gson
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}