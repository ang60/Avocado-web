# AvoGuard — static Vite SPA
# Copy to server, adjust root path, then:
#   sudo cp deploy/nginx-avoguard.cognitron.coke.conf /etc/nginx/sites-available/avoguard.cognitron.coke
#   sudo ln -sf /etc/nginx/sites-available/avoguard.cognitron.coke /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS (recommended): sudo certbot --nginx -d avoguard.cognitron.coke

server {
    listen 80;
    listen [::]:80;
    server_name avoguard.cognitron.coke;

    # After certbot, uncomment and use the HTTPS server block below instead,
    # or let certbot modify this file automatically.

    root /var/www/Avocado-web/dist;
    index index.html;

    # GeoJSON and static assets
    location /geo/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: all routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/avoguard.access.log;
    error_log  /var/log/nginx/avoguard.error.log;
}

