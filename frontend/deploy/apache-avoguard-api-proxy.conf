# Proxy /api on the SPA host to the hosted Django API (Vercel).
# Install (after a2enmod proxy proxy_http ssl):
#   sudo cp deploy/apache-avoguard-api-proxy.conf /etc/apache2/conf-available/avoguard-api-proxy.conf
#   sudo a2enconf avoguard-api-proxy
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Or Include this file inside the avoguard VirtualHost.

<IfModule mod_proxy.c>
    ProxyPreserveHost Off
    ProxyPass /api https://avo-guard.vercel.app/api
    ProxyPassReverse /api https://avo-guard.vercel.app/api
</IfModule>
