# AvoGuard — static Vite SPA (Apache 2.4+)
#
# Requires:
#   sudo a2enmod headers proxy proxy_http ssl
#   sudo cp deploy/apache-avoguard-api-proxy.conf /etc/apache2/conf-available/avoguard-api-proxy.conf
#   sudo a2enconf avoguard-api-proxy
#
# Install:
#   sudo cp deploy/apache-avoguard.cognitron.conf /etc/apache2/sites-available/avoguard.conf
#   # Edit ServerName + DocumentRoot if needed
#   sudo a2ensite avoguard.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# HTTPS: sudo certbot --apache -d avoguard.example.com
#
# This vhost serves frontend/dist (SPA). API: enable avoguard-api-proxy.conf so
# /api on this host forwards to https://avo-guard.vercel.app/api .
# Build on the server:
#   cd frontend && ./scripts/deploy-cognitron.sh --reload-apache
# or: npm run build:cognitron

<VirtualHost *:80>
    ServerName avoguard.cognitron.co.ke
    # After repo split: Vite build output lives under frontend/dist
    DocumentRoot /var/www/Avocado-web/frontend/dist

    ErrorLog ${APACHE_LOG_DIR}/avoguard-error.log
    CustomLog ${APACHE_LOG_DIR}/avoguard-access.log combined

    <Directory /var/www/Avocado-web/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        # SPA: unknown paths → index.html (real files under /, /assets/, /geo/ still served)
        FallbackResource /index.html
    </Directory>

    <IfModule mod_headers.c>
        <LocationMatch "^/geo/">
            Header set Cache-Control "public, max-age=3600"
        </LocationMatch>
        <LocationMatch "^/assets/">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </LocationMatch>
    </IfModule>
</VirtualHost>

# After certbot, you’ll get a :443 vhost; or add manually, e.g.:
#
# <VirtualHost *:443>
