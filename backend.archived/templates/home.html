    <title>AvoGuard API</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: rgb(113, 113, 130);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        h1 {
            color: rgb(27, 67, 50);
            margin-bottom: 20px;
        }
        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }
        .logo {
            width: 80px;
            height: 80px;
            margin-right: 15px;
        }
        .logo-text {
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .main-text {
            font-size: 2.5rem;
            font-weight: bold;
            color: rgb(27, 67, 50);
            line-height: 1;
        }
        .sub-text {
            font-size: 1rem;
            color: rgb(113, 113, 130);
            margin-top: 5px;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 40px;
        }
        .btn-container {
            display: flex;
            gap: 20px;
        }
        .btn {
            background-color: rgb(27, 67, 50);
            color: white;
            padding: 15px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: opacity 0.3s;
        }
        .btn:hover {
            opacity: 0.8;
        }
        .btn-secondary {
            background-color: rgb(113, 113, 130);
        }
        .menu {
            position: absolute;
            top: 20px;
            right: 20px;
        }
        .menu a {
            color: rgb(27, 67, 50);
            text-decoration: none;
            font-weight: bold;
            margin-left: 20px;
        }
    </style>
</head>
